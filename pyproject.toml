[project]
name = "pc-price-tracker"
version = "0.1.0"
description = "Ежедневный сбор цен на ПК-комплектующие для контент-конвейера"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "typer>=0.12",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# OPTIONAL, and deliberately not a core dependency. Only the Citilink
# adapter needs a real browser (see sources/citilink.py for the 29.08.2026
# policy change that allows one). Keeping it out of `dependencies` means:
#   - `pip install -e .` stays small and pure-Python;
#   - CI installs `.[dev]` only, never downloads a browser, and never runs
#     one — live scraping remains excluded from CI on purpose;
#   - importing pc_price_tracker without playwright still works. The import
#     is lazy inside sources/browser.py, and a missing browser surfaces as
#     SourceBlocked for that one source rather than breaking the package.
# Install with:
#   pip install -e ".[browser]" && python -m playwright install chromium
browser = [
    "playwright>=1.40",
]

[project.scripts]
pc-price-tracker = "pc_price_tracker.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
