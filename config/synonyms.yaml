# Brand alias table used as a fallback when a source doesn't supply a
# structured vendor field (RawOffer.brand_hint) and the brand has to be
# guessed from free-text title. Keys are lowercase tokens as they might
# appear in a title, values are the canonical brand name we store.
brand_aliases:
  nvidia: NVIDIA
  geforce: NVIDIA
  amd: AMD
  radeon: AMD
  intel: Intel
  asus: ASUS
  msi: MSI
  gigabyte: Gigabyte
  asrock: ASRock
  biostar: Biostar
  colorful: Colorful
  palit: Palit
  kfa2: KFA2
  gainward: Gainward
  zotac: Zotac
  inno3d: Inno3D
  pny: PNY
  kingston: Kingston
  corsair: Corsair
  gskill: G.Skill
  g.skill: G.Skill
  crucial: Crucial
  adata: ADATA
  xpg: ADATA
  patriot: Patriot
  teamgroup: TeamGroup
  team: TeamGroup
  geil: GeIL
  apacer: Apacer
  samsung: Samsung
  wd: WD
  westerndigital: WD
  seagate: Seagate
  kingspec: KingSpec
  deepcool: DeepCool
  coolermaster: Cooler Master
  bequiet: be quiet!
  thermalright: Thermalright
  thermaltake: Thermaltake
  noctua: Noctua
  zalman: Zalman
  idcooling: ID-COOLING
  aerocool: AeroCool
  gamemax: GameMax
  chieftec: Chieftec
  fsp: FSP
  seasonic: Seasonic
  exegate: ExeGate
  fractal: Fractal Design
  lianli: Lian Li
  nzxt: NZXT
  antec: Antec

  # Hyphenated / spaced spellings of brands ALREADY listed above. Lookup is
  # a \b-anchored match of the token against the lowercased title, so
  # "idcooling" simply never matches a title that writes "ID-COOLING" — the
  # entry above it was unreachable for real titles. Found 29.08.2026 when
  # Citilink (which supplies no vendor field, so it depends entirely on this
  # table) sent 24 of 36 coolers to `unmatched` with "could not resolve
  # brand", every one of them an ID-COOLING part.
  id-cooling: ID-COOLING
  cooler master: Cooler Master
  be quiet: be quiet!

  # Cooler/case brands that were missing outright. Not invented — each one
  # is a brand string this project already stores in `products`, learned
  # from Regard's structured vendor field. Appended at the end on purpose:
  # _resolve_brand returns the FIRST matching alias, so adding entries here
  # cannot change how any title already resolves.
  digma: Digma
  formula: Formula
  bloody: Bloody
  pccooler: PCcooler
  jonsbo: Jonsbo
  gelid: GELID
  arctic: Arctic
  scythe: Scythe
  silverstone: Silverstone

# Marketing / chip-brand words that add no identifying information once the
# real brand (AIB partner, module maker, ...) is already known, so they are
# dropped before the remaining title text is tokenized into a model name.
#
# Includes Russian category-prefix nouns ("Процессор AMD Ryzen ...") even
# though Regard's own `title` field happens not to need it (it keeps the
# category word only in `full_title`) — a different source is very likely
# to put the category word right in the name, and without stripping it two
# stores' listings for the same physical product would tokenize to
# different keys and never collapse into one product.
noise_words:
  - NVIDIA
  - GeForce
  - AMD
  - Radeon
  - Intel
  - Процессор
  - Видеокарта
  - Материнская плата
  - Оперативная память
  - Накопитель
  - Внутренний
  - Блок питания
  - Корпус
  - Кулер
  # Citilink's category phrasings. Listed longest-first because
  # _strip_noise_words removes entries in order and the shorter phrase is a
  # substring of the longer one. Without these, a Citilink cooler tokenizes
  # to "устройство-охлаждения-ag400-4-pin-черный" and can never collapse
  # onto Regard's "ag400" for the same physical part — the category noun
  # becomes part of the product identity.
  - Система водяного охлаждения
  - Система охлаждения
  - Устройство охлаждения
  - Graphics
  - Video
  - Card
  - Series
