# Brand alias table used as a fallback when a source doesn't supply a
# structured vendor field (RawOffer.brand_hint) and the brand has to be
# guessed from free-text title. Keys are lowercase tokens as they might
# appear in a title, values are the canonical brand name we store.
brand_aliases:
  nvidia: NVIDIA
  geforce: NVIDIA
  amd: AMD
  radeon: AMD
  intel: Intel
  asus: ASUS
  msi: MSI
  gigabyte: Gigabyte
  asrock: ASRock
  biostar: Biostar
  colorful: Colorful
  palit: Palit
  kfa2: KFA2
  gainward: Gainward
  zotac: Zotac
  inno3d: Inno3D
  pny: PNY
  kingston: Kingston
  corsair: Corsair
  gskill: G.Skill
  g.skill: G.Skill
  crucial: Crucial
  adata: ADATA
  xpg: ADATA
  patriot: Patriot
  teamgroup: TeamGroup
  team: TeamGroup
  geil: GeIL
  apacer: Apacer
  samsung: Samsung
  wd: WD
  westerndigital: WD
  seagate: Seagate
  kingspec: KingSpec
  deepcool: DeepCool
  coolermaster: Cooler Master
  bequiet: be quiet!
  thermalright: Thermalright
  thermaltake: Thermaltake
  noctua: Noctua
  zalman: Zalman
  idcooling: ID-COOLING
  aerocool: AeroCool
  gamemax: GameMax
  chieftec: Chieftec
