  nzxt: NZXT
  antec: Antec

# Marketing / chip-brand words that add no identifying information once the
# real brand (AIB partner, module maker, ...) is already known, so they are
# dropped before the remaining title text is tokenized into a model name.
#
# Includes Russian category-prefix nouns ("Процессор AMD Ryzen ...") even
# though Regard's own `title` field happens not to need it (it keeps the
# category word only in `full_title`) — a different source is very likely
# to put the category word right in the name, and without stripping it two
# stores' listings for the same physical product would tokenize to
# different keys and never collapse into one product.
noise_words:
  - NVIDIA
  - GeForce
  - AMD
  - Radeon
  - Intel
  - Процессор
  - Видеокарта
  - Материнская плата
  - Оперативная память
  - Накопитель
  - Внутренний
  - Блок питания
  - Корпус
  - Кулер
  - Graphics
  - Video
  - Card
  - Series
