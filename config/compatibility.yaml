# Совместимость комплектующих. Все пороги и таблицы здесь, чтобы их можно
# было поправить без изменения кода. Сами проверки (сокет CPU == сокет
# платы, тип памяти платы == тип модуля, ...) — в pc_price_tracker/compat.py,
# здесь только числа и таблицы, которые нужно уметь крутить руками.

# Насколько блок питания должен перекрывать оценочное потребление системы.
# 1.3 = запас 30%, как в брифе.
psu_headroom_ratio: 1.3

# Видеокарты у Regard не публикуют TDP в карточке (только в маркетинговом
# описании, ненадёжно для парсинга), поэтому оцениваем класс видеокарты по
# объёму памяти как грубый proxy. Это ПРИБЛИЖЕНИЕ, не измеренное значение —
# правьте таблицу, если оценки БП кажутся систематически заниженными или
# завышенными.
gpu_tdp_estimate_by_memory_gb:
  - {max_memory_gb: 6, tdp_w: 130}
  - {max_memory_gb: 10, tdp_w: 200}
  - {max_memory_gb: 12, tdp_w: 260}
  - {max_memory_gb: 16, tdp_w: 320}
  - {max_memory_gb: 999, tdp_w: 400}

# Если видеокарты в сборке нет (профиль office/student без дискретной
# видеокарты), она в оценку потребления не входит.
default_gpu_tdp_w: 0

# Материнская плата, память, накопители, вентиляторы корпуса и т.п. — то,
# что не покрыто отдельными оценками выше.
baseline_system_overhead_w: 60
